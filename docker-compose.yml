version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1
  env_file:
    - .env.local
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
  volumes:
    - ./dags:/opt/airflow/dags
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - airguard-net

services:
  postgres-airguard:
    image: postgres:15
    environment:
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: airguard_password
      POSTGRES_DB: airguard
    volumes:
      - airguard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airguard"]
      interval: 5s
      retries: 5
    networks:
      - airguard-net

  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - airguard-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - airguard-net

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.local
    environment:
      - AIRGUARD_ENV=local
      - AIRFLOW_API_URL=http://airflow-webserver:8080/api/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres-airguard:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - airguard-net

  frontend-placeholder:
    image: nginx:alpine
    ports:
      - "3000:80"
    networks:
      - airguard-net

networks:
  airguard-net:
    driver: bridge

volumes:
  airguard-db-data:
  airflow-db-data:
